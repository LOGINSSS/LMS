# 网关基础配置：服务名 + Nacos 地址 + 配置中心导入
# 端口/路由/白名单在 Nacos lms-gateway.yaml；JWT 密钥/Redis 在 Nacos 共享 lms-common.yaml
server:
  port: 8080

spring:
  application:
    name: lms-gateway
  config:
    import:
      - "optional:nacos:lms-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:lms-gateway.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      discovery:
        locator:
          enabled: true           # 开发便利：/{serviceId}/** 自动路由直达（生产应关闭）
          lower-case-service-id: true

logging:
  level:
    org.springframework.cloud.gateway: info
    com.lms.gateway.filter: debug
