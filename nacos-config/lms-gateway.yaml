# ============================================================
# lms-gateway 网关配置（端口/路由/鉴权白名单）
# ============================================================
server:
  port: 8080

spring:
  cloud:
    gateway:
      # 跨域：允许前端开发服务器直连网关（生产改为同域反代）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # 认证服务：登录/注册放行，其余经网关 JWT 校验
        - id: lms-auth
          uri: lb://lms-auth
          predicates:
            - Path=/auth/**
        # 用户服务：档案查询/管理端（需登录）
        - id: lms-user
          uri: lb://lms-user
          predicates:
            - Path=/users/**,/admin/users/**
        # 课程服务：卡片展示/选课/教师管理（需登录）
        - id: lms-course
          uri: lb://lms-course
          predicates:
            - Path=/courses/**,/admin/courses/**
        # 媒资服务：文件/视频上传与管理（需登录；静态访问 /uploads/** 直连 8088）
        - id: lms-media
          uri: lb://lms-media
          predicates:
            - Path=/medias/**
        # 评价互动服务：点赞（需登录）
        - id: lms-remark
          uri: lb://lms-remark
          predicates:
            - Path=/likes/**
        # 搜索服务：ES 课程搜索/推荐/兴趣标签（需登录）
        - id: lms-search
          uri: lb://lms-search
          predicates:
            - Path=/search/**,/interests/**
        # 考试题库服务：题目管理（教师）/按业务取题（需登录）
        - id: lms-exam
          uri: lb://lms-exam
          predicates:
            - Path=/admin/questions/**,/questions/**
        # 学习过程服务：课次/学习记录/笔记/问答/签到/积分（需登录；
        # 问答用 /qa/** 前缀规避 exam 的 /questions/**）
        - id: lms-learning
          uri: lb://lms-learning
          predicates:
            - Path=/lessons/**,/admin/lessons/**,/learn/**,/notes/**,/qa/**,/sign-in,/points/**
        # 数据中心服务：数据看板/今日数据/Top10（需登录）
        - id: lms-statistics
          uri: lb://lms-statistics
          predicates:
            - Path=/dashboard/**
        # AI 服务：单轮 chat + 个人 Agent（/agent/**，spec §8.1）
        - id: lms-ai
          uri: lb://lms-ai
          predicates:
            - Path=/ai/**,/agent/**
        # 知识库服务：知识库管理/文档入库/RAG 问答/评估
        - id: lms-kb
          uri: lb://lms-kb
          predicates:
            - Path=/kb/**,/rag/**,/eval/**

lms:
  gateway:
    # 免登录白名单（ant 风格路径）
    whitelist:
      - /auth/login
      - /auth/register
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /favicon.ico
      - /actuator/**
      # IM 平台回调：放行但由 lms-ai 验签（spec §7.3 安全：回调只做投递）
      - /agent/im/callback/**
