# ============================================================
# lms-gateway 网关配置（端口/路由/鉴权白名单）
# ============================================================
server:
  port: 8080

spring:
  cloud:
    gateway:
      # 跨域：允许前端开发服务器直连网关（生产改为同域反代）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # 认证服务：登录/注册放行，其余经网关 JWT 校验
        - id: lms-auth
          uri: lb://lms-auth
          predicates:
            - Path=/auth/**
        # 用户服务：档案查询/管理端（需登录）
        - id: lms-user
          uri: lb://lms-user
          predicates:
            - Path=/users/**,/admin/users/**
        # 课程服务：卡片展示/选课/教师管理（需登录）
        - id: lms-course
          uri: lb://lms-course
          predicates:
            - Path=/courses/**,/admin/courses/**
        # 媒资服务：文件/视频上传与管理（需登录；静态访问 /uploads/** 直连 8088）
        - id: lms-media
          uri: lb://lms-media
          predicates:
            - Path=/medias/**
        # 评价互动服务：点赞（需登录）
        - id: lms-remark
          uri: lb://lms-remark
          predicates:
            - Path=/likes/**
        # 搜索服务：ES 课程搜索/推荐/兴趣标签（需登录）
        - id: lms-search
          uri: lb://lms-search
          predicates:
            - Path=/search/**,/interests/**
        # 考试题库服务：题目管理（教师）/按业务取题（需登录）
        - id: lms-exam
          uri: lb://lms-exam
          predicates:
            - Path=/admin/questions/**,/questions/**
        # AI 服务
        - id: lms-ai
          uri: lb://lms-ai
          predicates:
            - Path=/ai/**

lms:
  gateway:
    # 免登录白名单（ant 风格路径）
    whitelist:
      - /auth/login
      - /auth/register
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /favicon.ico
      - /actuator/**
