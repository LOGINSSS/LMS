spring:
  application:
    name: lms-auth                        # 服务名：注册到 Nacos，Feign 调用方按此名寻址
  cloud:
    nacos:
      server-addr: localhost:8848         # Nacos 注册中心 / 配置中心地址
  config:
    import:
      - optional:nacos:lms-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true    # 公共配置（含 JWT 密钥等），optional 表示缺失不阻断启动
      - optional:nacos:lms-auth.yaml?group=DEFAULT_GROUP&refreshEnabled=true      # 本服务专属配置，覆盖/补充公共配置项
