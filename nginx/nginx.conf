# ============================================================
# LMS 前端 nginx 配置（玩法 1：托管构建产物 + /api 反代网关）
#
# 作用：
#   - 托管 lms-web 构建产物（SPA，history 路由 fallback 到 index.html）
#   - 把 /api/** 反代到 Spring Cloud Gateway（8080）并去掉 /api 前缀，
#     网关路由无需改动（/api/auth/login -> /auth/login）
#   - 前端构建产物默认 baseURL 为 /api（lms-web/src/api/request.js 兜底值），
#     与本配置天然匹配，同源后不再依赖网关 CORS
#
# 用法（本机 Windows nginx）：
#   1) npm run build 生成 lms-web/dist
#   2) 把本文件放到 nginx 安装目录 conf/ 下（或 include 引入）
#   3) 修改下方 root 路径为你的 dist 实际路径
#   4) nginx -t 校验配置，然后启动 nginx
#
# 用法（docker compose，可选）：
#   docker 容器内访问宿主机网关请把 proxy_pass 的 127.0.0.1 改为
#   host.docker.internal（Windows/Mac Docker Desktop 支持）
# ============================================================

server {
    listen       80;
    server_name  localhost;

    # 前端构建产物（改成你的实际路径，Windows 用正斜杠）
    root  D:/ASTUDY/TheRoadOfGold/project/LMS/lms-web/dist;
    index index.html;

    # 静态资源：带 hash 的产物长缓存，避免每次请求都打后端
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由 fallback：history 模式刷新任意路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代：/api/** -> 网关（去掉 /api 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
