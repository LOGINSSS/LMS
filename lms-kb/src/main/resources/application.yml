server:
  port: 8096

spring:
  application:
    name: lms-kb
  # 从 Nacos 配置中心拉取配置（optional：Nacos 中暂无配置时不影响启动，本地配置兜底）
  config:
    import:
      - optional:nacos:lms-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:lms-kb.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        group: DEFAULT_GROUP
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:13306/lms_kb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    elasticsearch:
      uris: ${ES_HOST:http://localhost:9200}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /doc.html

# ============ 知识库业务配置 ============
lms:
  mvc:
    # 开启网关 user-info 头解析 → UserContext（/kb/my 个人知识库等接口需要当前用户，spec §4.4）
    user-header-enabled: true
  kb:
    # ES 切片索引名
    es-index: lms_kb_chunk
    # embedding 向量维度（DashScope text-embedding-v3）
    dense-dim: 1024
    # 混合检索每路候选数 / 精排后保留条数 / RRF 平滑常数
    fetch-k: 20
    rerank-top-k: 5
    rrf-k: 60
    # 兜底分片参数（中文友好分隔符）
    chunk-size: 900
    chunk-overlap: 100
    # embedding 单次请求批量上限（DashScope 限制 10）
    embed-batch-size: 10
    # 文档解析管道线程池
    pipeline-threads: 4
  ai:
    # DashScope（Qwen-VL 生成 / embedding / rerank），api-key 走环境变量
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    dashscope-native-url: https://dashscope.aliyuncs.com/api/v1
    qwen-vl-model: qwen-vl-max
    embedding-model: text-embedding-v3
    rerank-model: gte-rerank-v2
    # DeepSeek（rewrite 用 R1 reasoner / HyDE 用 chat），api-key 走环境变量
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url: https://api.deepseek.com
    deepseek-reasoner-model: deepseek-reasoner
    deepseek-chat-model: deepseek-chat

logging:
  level:
    com.lms.kb: debug
