# 用户服务配置：注册到 Nacos 并拉取公共/本服务配置
spring:
  application:
    name: lms-user  # 服务名：注册到 Nacos，供网关按服务名路由
  cloud:
    nacos:
      server-addr: localhost:8848  # Nacos 注册中心 / 配置中心地址
  config:
    import:
      # 公共配置：各服务共享的通用项（数据源、Redis、公共 bean 等）
      - optional:nacos:lms-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      # 本服务配置：lms-user 专属项（含 user-info 头解析开关 lms.mvc.user-header-enabled）
      - optional:nacos:lms-user.yaml?group=DEFAULT_GROUP&refreshEnabled=true
