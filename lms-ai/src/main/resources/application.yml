server:
  port: 8095

spring:
  application:
    name: lms-ai
  # 从 Nacos 配置中心拉取配置（optional：Nacos 中暂无配置时不影响启动，本地配置兜底）
  config:
    import:
      - optional:nacos:lms-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:lms-ai.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        group: DEFAULT_GROUP
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:13306/lms_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:29092}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# ============ AgentScope Java（LLM 模型接入，配置键经本地 jar 源码核对） ============
# 模型后端：通义千问 DashScope（OpenAI 兼容模式）
# api-key 通过环境变量 DASHSCOPE_API_KEY 注入，不要写死在代码/配置文件里
agentscope:
  openai:
    enabled: true                                            # 启用 OpenAI 兼容模型自动配置（默认 qwen-plus 单模型）
    api-key: ${DASHSCOPE_API_KEY:}                           # 阿里云百炼 API Key
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model-name: qwen-plus                                    # 通义千问模型（qwen-plus / qwen-max / qwen-turbo）
    stream: true
  model:
    provider: dashscope

# ============ 个人 Agent 体系（spec §9：阶段开关，关闭即回退上一阶段能力） ============
lms:
  mvc:
    # 开启网关 user-info 头解析 → UserContext（/agent/** 需登录，spec §8.1）
    user-header-enabled: true
  ai:
    agent:
      enabled: true                                          # Agent 运行时总开关（阶段 1）
      # 子 Agent 声明文件路径（classpath 下 agents/*.yaml，spec §3.2）
      declaration-path: agents
      # 模型分级（spec §10）：编排 qwen-max / 子 agent qwen-plus / 摘要压缩 qwen-turbo
      orchestrator-model: qwen-max
      subagent-model: qwen-plus
      summary-model: qwen-turbo
      # L1 会话消息 Redis TTL（天，spec §4.1）
      session-ttl-days: 7
      # AgentScope ReMe 长期记忆（spec §4.3 L2：对话轨迹提取-整合-检索注入）
      # 需先部署 ReMe 服务端（官方仓库 agentscope-ai/ReMe，Docker 或百炼云服务），
      # 填好 base-url 并 enabled=true 后生效；未配置自动回退 MySQL 画像记忆
      reme:
        enabled: ${LMS_REME_ENABLED:false}
        base-url: ${LMS_REME_BASE_URL:}
        timeout-ms: 3000
        workspace-prefix: user_
      # 互调深度限制（spec §5.3：个人 agent → 子 agent → 工具，≤3）
      max-invoke-depth: 3
      # 高副作用工具（建题/上架/推送）前置人工确认（阶段 5 加固项，当前先提示不拦截）
      require-confirm: false
    # ============ 全局 Harness（管控护栏，spec GLOBAL_HARNESS_SPEC） ============
    # 会话全局一份，不下沉专家 Agent：邀请前置拦截（深度/白名单/高危 HITL）
    # + 会话生命周期兜底（turn/token）+ Trace 可观测
    harness:
      enabled: true                                          # 总开关（false = 全部放行只留日志，阶段回退用）
      invite:
        # 邀请最大嵌套深度（个人 agent → 子 agent → …；与 spec §5.3 的 max-invoke-depth 对齐）
        max-depth: 3
        # 高危专家（声明 risk=high）邀请策略：ask=强制人工确认（默认）/ deny=直接拒绝 / log=记录放行（联调用）
        high-risk-policy: ask
        # 会话级额外禁止邀请的专家名（叠加在声明 subAgents 白名单之上，越权名单）
        deny-agents: []
        # 会话白名单覆盖：inviter agent 名 → 允许邀请的 target（可选；不配=声明 subAgents）
        # 例：teacher-agent: [exam-agent, course-agent]   # 收窄：不允许 teacher 邀 learning-agent
        whitelist-override: {}
      hitl:
        enabled: true                                        # HITL 通道开关（false = 高危退化为直接拒绝）
        request-ttl-seconds: 600                             # 确认请求有效期（10 分钟，超时自动失效）
        approval-ttl-seconds: 1800                           # 批复缓存：批准后同会话同目标 30 分钟内免重复确认
        hint: 该操作涉及业务数据写入/外部触达，需要人工确认
      session:
        # 会话生命周期兜底：0 = 不限（默认练手放开；生产建议如 50 轮 / 50000 token）
        max-user-turns: 0
        max-tokens: 0
      trace:
        enabled: true                                        # Trace 埋点开关
        recent-limit: 200                                    # 每会话保留条数（环形缓冲）
        ttl-days: 7                                          # Trace Redis TTL（天）
    # ============ 重型 Harness v2（管控护栏升级，spec HEAVY_HARNESS_SPEC） ============
    # 在 v1（上方 lms.ai.harness）基础上：统一 PolicyEngine 判定链 + 动作级 HITL（invite/工具/任务）
    # enabled=false → 回退 v1 行为（阶段回退）；角色矩阵 / 高危策略覆盖见 PolicyEngine / HarnessV2Properties
    harness-v2:
      enabled: true                                          # v2 总开关（false = 全部回退 v1：v1 也关则只留日志）
      high-risk-policy: ""                                   # 高危动作策略覆盖：ask/deny/log；空 = 沿用 v1 invite.high-risk-policy
      role-rules: []                                         # 角色矩阵追加规则：ACTION:targetPattern:minUserType（如 CALL_TOOL:course.*:2）
      tool-gateway-enabled: true                             # L3 工具执行网关：注册即包 GuardedFunctionTool 过 PolicyEngine（false = P0 直注）
      tool-risk: {}                                          # 工具风险覆盖表：toolId(domain.method) → high（缺省 normal + @Tool readOnly 分流）
      tool-switch-off: []                                    # 静态关停工具名单（动态关停走 Redis 键 tool:switch:{toolId}，值 off）
      # P4 会话预算（0=不限，缺省；开启后超限由 PolicyEngine DENY 提示新建会话）
      max-write-calls: 0                                     # 写工具调用次数上限
      max-invites: 0                                         # 邀请次数上限
      # P2 LLM 意图分类（规则层未命中时二级识别；默认关，避免每轮额外模型调用）
      intent-llm-enabled: false                              # true 开启 qwen-turbo 意图分类
      intent-min-confidence: 0.6                             # 置信阈值（低于 → UNKNOWN 兜底）
      intent-llm-max-text-len: 200                           # 输入长度上限（控成本）
      # P4 LLM 摘要压缩（长会话把最旧一段压成摘要注入；false = 现状 trimHalf 裁剪）
      summary-enabled: false
      summary-threshold: 30                                  # 消息条数阈值触发压缩
      summary-keep: 15                                       # 压缩后保留最近条数
    im:
      enabled: true                                          # IM 管道开关（阶段 4）
      channel: console                                       # console | wecom | wechat | qq
      wecom-webhook: ""                                      # 企微群机器人 webhook（启用 wecom 时配置）
      callback-secret: ""                                    # 平台回调验签密钥
    task:
      enabled: true                                          # 定时任务开关（阶段 4）
      topic: lms-agent-task                                 # 任务事件 Kafka topic
      behavior-topic: lms-agent-behavior                    # 行为事件 Kafka topic（spec §4.3）
      # Kafka 事件通知开关（默认关：练手用落库 + @Scheduled 轮询，Kafka 仅做事件通知，spec §11）
      kafka-enabled: false
      # 未回复提醒延迟（秒）：学生问答 2 小时
      qa-remind-delay-seconds: 7200

# Knife4j / springdoc
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /doc.html
